services:
  - type: web
    name: viewmystartup-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    initialDeployHook: npx prisma db seed
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: viewmystartup-postgres
          property: connectionString

databases:
  - name: viewmystartup-postgres
    databaseName: viewmystartup
    region: singapore
    plan: free
